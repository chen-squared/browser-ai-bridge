<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>会议 · browser-ai-bridge</title>
    <style>
      /* 布局语言照着各 provider 的网页来（左侧历史栏 + 中间窄列 + 底部输入卡片），
         只是换成深色，和控制台保持一致。 */
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --sidebar: #0a0e14;
        --panel: #161d27;
        --panel-hi: #1c2531;
        --ink: #e6edf3;
        --ink-dim: #9aa7b4;
        --ink-faint: #6b7887;
        --line: #232c39;
        --line-hi: #35414f;
        --accent: #4a9eff;
        --accent-dim: #1f6feb;
        --ok: #3fb950;
        --warn: #d29922;
        --danger: #f85149;
        --sidebar-w: 260px;
        --column-w: 780px;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.7;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      button {
        padding: 7px 13px;
        border: 1px solid var(--line-hi);
        border-radius: 8px;
        background: var(--panel-hi);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        border-color: #4a5b73;
        background: #232e3c;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      button.primary {
        border-color: var(--accent-dim);
        background: var(--accent-dim);
        color: #fff;
      }

      button.primary:hover:not(:disabled) {
        background: #2b7cf0;
      }

      button.ghost {
        border-color: transparent;
        background: none;
        color: var(--ink-dim);
      }

      button.ghost:hover:not(:disabled) {
        background: var(--panel-hi);
        color: var(--ink);
      }

      input,
      textarea,
      select {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 14px;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--accent-dim);
        outline: none;
      }

      /* ── 骨架 ───────────────────────────────────────────────── */
      .app {
        display: grid;
        grid-template-columns: var(--sidebar-w) 1fr;
        height: 100vh;
      }

      /* ── 侧栏 ───────────────────────────────────────────────── */
      .sidebar {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: var(--sidebar);
        overflow: hidden;
      }

      .sidebar-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 12px 8px;
      }

      /* 窄屏下侧栏是整屏浮层，桌面端并排放，用不着关闭键 */
      .sidebar-close {
        display: none;
      }

      .brand {
        flex: 1;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }

      .brand a {
        color: var(--ink);
        text-decoration: none;
      }

      .new-meeting {
        margin: 0 12px 10px;
        padding: 10px;
        border-radius: 10px;
        font-size: 13.5px;
      }

      .history {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px 12px;
      }

      .history-group {
        margin-top: 12px;
        padding: 0 6px 4px;
        color: var(--ink-faint);
        font-size: 11.5px;
      }

      .history-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 8px;
        border: none;
        border-radius: 8px;
        background: none;
        color: var(--ink-dim);
        font-size: 13px;
        text-align: left;
        width: 100%;
        cursor: pointer;
      }

      .history-item:hover {
        background: var(--panel-hi);
        color: var(--ink);
      }

      .history-item[aria-current='true'] {
        background: var(--panel-hi);
        color: var(--ink);
      }

      .history-title {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .history-meta {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 10px;
      }

      .history-del {
        padding: 0 4px;
        border: none;
        background: none;
        color: var(--ink-faint);
        font-size: 14px;
        line-height: 1;
        opacity: 0;
      }

      .history-item:hover .history-del {
        opacity: 1;
      }

      .history-del:hover {
        color: var(--danger);
        background: none;
      }

      .sidebar-empty {
        padding: 20px 12px;
        color: var(--ink-faint);
        font-size: 12.5px;
        text-align: center;
      }

      /* ── 主区 ───────────────────────────────────────────────── */
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }

      .topbar h1 {
        flex: 1;
        margin: 0;
        overflow: hidden;
        font-size: 14px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .title-input {
        flex: 1;
        padding: 5px 8px;
        font-size: 14px;
        font-weight: 600;
      }

      .scroll {
        flex: 1;
        overflow-y: auto;
      }

      .column {
        max-width: var(--column-w);
        margin: 0 auto;
        padding: 26px 20px 8px;
      }

      /* ── 空态 ───────────────────────────────────────────────────
     垂直居中：各家 provider 的首屏都是这样，视线不用先往上找。 */
      .welcome {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 260px);
        max-width: var(--column-w);
        margin: 0 auto;
        padding: 20px;
        text-align: center;
      }

      /* `hidden` 属性自带的 display:none 会被上面这条 display:flex 盖掉，
         所以必须显式再写一次——否则打开会议后空态仍然占着半个屏。 */
      .welcome[hidden] {
        display: none;
      }

      .welcome h2 {
        margin: 0 0 6px;
        font-size: 24px;
        font-weight: 600;
      }

      .welcome p {
        margin: 0 0 24px;
        color: var(--ink-dim);
        font-size: 14px;
      }

      /* ── 消息 ───────────────────────────────────────────────── */
      .turn {
        margin-bottom: 26px;
      }

      .msg {
        display: flex;
        gap: 11px;
        margin-bottom: 18px;
      }

      .msg.user {
        justify-content: flex-end;
      }

      /* 用户消息是右对齐的气泡。要限宽的是 .msg-main（真正的承载元素），
         限错元素的话 justify-content 就没东西可推，气泡会顶满整行。 */
      .msg.user .msg-main {
        max-width: 78%;
        flex: none;
      }

      .msg.user .msg-body {
        padding: 10px 15px;
        border: 1px solid var(--line-hi);
        border-radius: 16px;
        background: var(--panel-hi);
      }

      .avatar {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        margin-top: 2px;
        border-radius: 7px;
        background: var(--panel-hi);
        color: var(--ink-dim);
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 600;
      }

      .avatar.summary {
        background: var(--accent-dim);
        color: #fff;
      }

      .msg-main {
        min-width: 0;
        flex: 1;
      }

      .msg-who {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 3px;
        font-size: 12.5px;
      }

      .msg-name {
        font-weight: 600;
      }

      .msg-stage {
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--panel-hi);
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 10px;
      }

      .msg-body {
        font-size: 14.5px;
        word-break: break-word;
      }

      .msg-body > :first-child {
        margin-top: 0;
      }

      .msg-body > :last-child {
        margin-bottom: 0;
      }

      .msg-body p {
        margin: 0 0 10px;
      }

      .msg-body ul,
      .msg-body ol {
        margin: 0 0 10px;
        padding-left: 22px;
      }

      .msg-body pre {
        padding: 11px;
        border-radius: 8px;
        background: var(--bg);
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12.5px;
      }

      .msg-body code {
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--panel-hi);
        font-family: var(--mono);
        font-size: 12.5px;
      }

      .msg-body pre code {
        padding: 0;
        background: none;
      }

      .msg-body table {
        border-collapse: collapse;
        margin-bottom: 10px;
      }

      .msg-body th,
      .msg-body td {
        padding: 5px 10px;
        border: 1px solid var(--line);
      }

      .msg-body blockquote {
        margin: 0 0 10px;
        padding-left: 12px;
        border-left: 2px solid var(--line-hi);
        color: var(--ink-dim);
      }

      .summary-card {
        padding: 14px 16px;
        border: 1px solid var(--accent-dim);
        border-radius: 14px;
        background: rgba(31, 111, 235, 0.07);
      }

      .thinking summary {
        margin-bottom: 6px;
        color: var(--ink-faint);
        font-size: 12px;
        cursor: pointer;
      }

      /* ── 输入区 ─────────────────────────────────────────────── */
      .composer-wrap {
        padding: 10px 20px 18px;
      }

      .composer {
        max-width: var(--column-w);
        margin: 0 auto;
        padding: 12px 12px 10px;
        border: 1px solid var(--line-hi);
        border-radius: 16px;
        background: var(--panel);
        transition: border-color 0.15s;
      }

      .composer:focus-within {
        border-color: #46536a;
      }

      .composer textarea {
        width: 100%;
        min-height: 54px;
        max-height: 220px;
        padding: 2px 4px;
        border: none;
        background: none;
        font-size: 15px;
        line-height: 1.65;
        resize: none;
      }

      .composer textarea:focus {
        outline: none;
      }

      .composer-row {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }

      /* 功能 chip：顺序、席位、总结者都收在这里，点开是设置面板 */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border: 1px solid var(--line-hi);
        border-radius: 999px;
        background: var(--panel-hi);
        color: var(--ink-dim);
        font-size: 12.5px;
        cursor: pointer;
      }

      .chip:hover {
        color: var(--ink);
      }

      .chip[data-on='true'] {
        border-color: var(--accent-dim);
        color: var(--ink);
      }

      .chip-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink-faint);
      }

      .chip[data-on='true'] .chip-dot {
        background: var(--accent);
      }

      .spacer {
        flex: 1;
      }

      .send {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 50%;
        background: var(--accent-dim);
        color: #fff;
        font-size: 15px;
      }

      .send:disabled {
        background: var(--panel-hi);
        color: var(--ink-faint);
      }

      /* ── 设置面板 ───────────────────────────────────────────── */
      .settings {
        display: none;
        max-width: var(--column-w);
        margin: 0 auto 8px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
      }

      .settings[data-open='true'] {
        display: block;
      }

      .settings-title {
        margin-bottom: 8px;
        color: var(--ink-dim);
        font-size: 12px;
      }

      .mode-row {
        display: flex;
        gap: 7px;
        margin-bottom: 12px;
      }

      .mode-row .chip {
        padding: 6px 12px;
      }

      .seat-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }

      .seat {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
      }

      .seat select {
        flex: 1;
        padding: 5px 8px;
        font-size: 13px;
      }

      .seat-name {
        min-width: 76px;
        color: var(--ink-dim);
        font-family: var(--mono);
        font-size: 11px;
      }

      .seat button {
        padding: 3px 7px;
        font-size: 12px;
      }

      .settings-grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        margin-bottom: 10px;
      }

      .settings-grid label {
        display: block;
        color: var(--ink-dim);
        font-size: 12px;
      }

      .settings-grid select,
      .settings-grid input {
        width: 100%;
        margin-top: 3px;
        font-size: 13px;
      }

      .hint {
        margin: 0;
        color: var(--ink-faint);
        font-size: 11.5px;
      }

      /* ── 状态 ───────────────────────────────────────────────── */
      .status {
        max-width: var(--column-w);
        margin: 0 auto 8px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-left: 2px solid var(--ink-faint);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink-dim);
        font-size: 12.5px;
      }

      .status[data-tone='err'] {
        border-left-color: var(--danger);
        color: #ffb4ae;
      }

      .status[data-tone='busy'] {
        border-left-color: var(--accent);
      }

      .status[data-tone='busy']::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }

      .pending .msg-body::after {
        content: '▌';
        color: var(--accent);
        animation: blink 1s steps(2) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* 缺令牌时的遮罩。理由同控制台：页面打得开但接口全 401，
         不提前说清楚的话，用户只会看到点了没反应。 */
      .token-gate {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(8, 11, 16, 0.94);
      }

      .token-gate[data-show='true'] {
        display: flex;
      }

      .token-card {
        width: 100%;
        max-width: 420px;
        padding: 22px;
        border: 1px solid var(--line-hi);
        border-radius: 12px;
        background: var(--panel);
      }

      .token-card h2 {
        margin: 0 0 8px;
        font-size: 17px;
      }

      .token-card p {
        margin: 0 0 14px;
        color: var(--ink-dim);
        font-size: 13px;
        line-height: 1.6;
      }

      .token-card input {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--line-hi);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 13px;
      }

      .token-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .token-err {
        margin-top: 10px;
        color: var(--danger);
        font-size: 12px;
      }

      /* 正在逐字冒出来的气泡：光标一闪，让人一眼看出"还在写"。 */
      .msg.streaming .msg-body::after {
        content: '';
        display: inline-block;
        width: 7px;
        height: 1.05em;
        margin-left: 2px;
        vertical-align: text-bottom;
        background: var(--ink-dim);
        animation: caret 1s steps(2, start) infinite;
      }

      /* 还没出字：把"正在写…"写清楚，别让人对着光标猜 */
      .msg.speaking .msg-body {
        color: var(--ink-faint);
      }

      /* ── 折叠 ─────────────────────────────────────────────────
         一轮下来五六个模型各写几百字，时间线会被拉得很长。
         收起时留一行预览，不至于连"谁说了什么"都看不见。
      ─────────────────────────────────────────────────────── */
      .msg-caret {
        flex: none;
        width: 20px;
        height: 20px;
        margin-left: auto;
        border: none;
        border-radius: 5px;
        background: none;
        color: var(--ink-faint);
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
      }

      .msg-caret:hover {
        background: var(--bg-soft);
        color: var(--ink);
      }

      .msg-preview {
        display: none;
        color: var(--ink-faint);
        font-size: 13px;
        line-height: 1.6;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .msg.collapsed .msg-body {
        display: none;
      }

      .msg.collapsed .msg-preview {
        display: block;
      }

      /* 折叠中的气泡不显示光标，免得看着像还在写 */
      .msg.collapsed.streaming .msg-body::after {
        display: none;
      }

      @keyframes caret {
        50% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .msg.streaming .msg-body::after {
          animation: none;
        }
      }

      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: none;
        }

        .sidebar[data-open='true'] {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 30;
        }

        .sidebar-close {
          display: inline-flex;
        }

        /* 浮层开着的时候锁住背景滚动，否则手指在列表上滑会连带把正文带着动 */
        body[data-sidebar='open'] {
          overflow: hidden;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status[data-tone='busy']::before,
        .pending .msg-body::after {
          animation: none;
        }
      }
    </style>
    <script src="/vendor/marked/marked.umd.js"></script>
  </head>
  <body>
    <div class="token-gate" id="tokenGate">
      <div class="token-card">
        <h2>需要访问令牌</h2>
        <p>这台 bridge 能操控已登录的网页账号，所以开了令牌校验。粘到下面再进。</p>
        <input id="tokenInput" type="text" placeholder="粘贴 BRIDGE_TOKEN" />
        <div class="token-actions">
          <button class="primary" id="tokenSaveBtn">进入</button>
          <button class="ghost" id="tokenSkipBtn">先看看</button>
        </div>
        <div class="token-err" id="tokenErr"></div>
      </div>
    </div>

    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div class="brand"><a href="/">← 控制台</a></div>
          <button class="ghost" id="refreshListBtn" title="刷新列表">↻</button>
          <!--
            窄屏下侧栏是 position:fixed; inset:0 的整屏浮层，会把顶栏那个 ☰
            盖得严严实实，点都点不到，于是"打开了就关不掉"。这个 ✕ 只在窄屏出现
            （桌面端侧栏本来就是并排的一列，用不着）。
          -->
          <button class="ghost sidebar-close" id="closeSidebarBtn" title="关闭列表">✕</button>
        </div>
        <button class="new-meeting" id="newMeetingBtn">＋ 发起新会议</button>
        <div class="history" id="history"></div>
      </aside>

      <main class="main">
        <div class="topbar">
          <button class="ghost" id="toggleSidebarBtn" title="历史列表">☰</button>
          <h1 id="meetingTitle">新会议</h1>
          <span
            class="faint"
            id="meetingMeta"
            style="color: var(--ink-faint); font-size: 12px"
          ></span>
        </div>

        <div class="scroll" id="scroll">
          <div class="welcome" id="welcome">
            <h2>发起一场会议</h2>
            <p>多个模型围绕你的问题依次或同时作答，最后由一位总结者收口。</p>
          </div>
          <div class="column" id="transcript"></div>
        </div>

        <div class="composer-wrap">
          <div class="status" id="status">选好席位，写下第一个问题。</div>

          <div class="settings" id="settings">
            <div class="settings-title">编排方式</div>
            <div class="mode-row">
              <span class="chip" data-mode="round-robin" data-on="true">
                <span class="chip-dot"></span>顺序对话
              </span>
              <span class="chip" data-mode="parallel" data-on="false">
                <span class="chip-dot"></span>并行作答
              </span>
            </div>

            <div class="settings-title">参与者（顺序即发言顺序）</div>
            <div class="seat-list" id="seatList"></div>
            <div style="margin-bottom: 12px">
              <button class="ghost" id="addSeatBtn">添加参与者</button>
            </div>

            <div class="settings-grid">
              <label>
                总结者
                <select id="summarizer"></select>
              </label>
              <label>
                总结用哪个会话
                <select id="summarizerSeat"></select>
              </label>
              <label>
                发言轮数
                <input type="number" id="rounds" min="1" max="4" value="1" />
              </label>
            </div>
            <p class="hint" id="seatHint"></p>
          </div>

          <div class="composer">
            <textarea id="input" placeholder="给会议出题，例如：比较这三种实现的取舍。"></textarea>
            <div class="composer-row">
              <span class="chip" id="modeChip"><span class="chip-dot"></span>顺序对话</span>
              <span class="chip" id="seatsChip"
                ><span class="chip-dot"></span><span id="seatsChipText">3 个席位</span></span
              >
              <span class="chip" id="settingsChip"
                ><span class="chip-dot"></span><span id="settingsChipText">设置</span></span
              >
              <div class="spacer"></div>
              <button class="send" id="sendBtn" title="发送（⌘/Ctrl + Enter）" disabled>↑</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      const PROVIDERS = ['chatgpt', 'claude', 'deepseek', 'grok', 'qwen', 'gemini'];
      /** 席位数上限。与服务端 z.array(...).max(6) 对齐，别让界面能造出非法请求。 */
      const MAX_SEATS = 6;
      const LABELS = {
        chatgpt: 'ChatGPT',
        claude: 'Claude',
        deepseek: 'DeepSeek',
        grok: 'Grok',
        qwen: '通义千问',
        gemini: 'Gemini',
      };
      const MODE_LABEL = { 'round-robin': '顺序对话', parallel: '并行作答' };
      const STAGE_LABEL = { assignment: '分工', discussion: '发言', summary: '总结' };

      const state = {
        /** 当前打开的会议 id；null = 还没发过（还没落库） */
        meetingId: null,
        mode: 'round-robin',
        seats: ['chatgpt', 'claude', 'deepseek'].map((provider) => ({ provider })),
        summarizer: 'qwen',
        summarizerSeat: '',
        rounds: 1,
        seatAliases: [],
        /** 服务端给的 {alias, provider}。复用列表按 provider 过滤，所以两者都要留。 */
        planParticipants: [],
        /** 本轮容器；实时气泡和最终发言都挂在它下面，顺序才不会乱。 */
        turnWrap: null,
        busy: false,
      };

      function escapeHtml(value) {
        return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function render(value) {
        if (window.marked) {
          return window.marked.parse(value);
        }
        return escapeHtml(value).replace(/\n/g, '<br>');
      }

      function token() {
        try {
          // 也认 URL 上的 ?token=，和入口页保持一致。否则手机浏览器从收藏夹
          // 打开 /meeting（地址栏里没带令牌）必然落进令牌闸门，得手抄一遍。
          const fromUrl = new URLSearchParams(location.search).get('token');
          if (fromUrl) {
            try {
              sessionStorage.setItem('bridge.token', fromUrl);
            } catch {
              /* 隐私模式写不了，内存里的这份本次会话仍然有效 */
            }
            return fromUrl;
          }
          return sessionStorage.getItem('bridge.token') || '';
        } catch {
          return '';
        }
      }

      async function api(url, options) {
        const headers = { 'Content-Type': 'application/json', ...(options?.headers || {}) };
        const tk = token();
        if (tk) {
          headers['x-bridge-token'] = tk;
        }
        const response = await fetch(url, { ...(options || {}), headers });
        const text = await response.text();
        let payload = text;
        try {
          payload = JSON.parse(text);
        } catch {
          /* 不是 JSON 就按原文 */
        }
        if (!response.ok) {
          const message = payload?.error?.message || text || `HTTP ${response.status}`;
          if (/BRIDGE_TOKEN|令牌/.test(String(message))) {
            showTokenGate(message);
          }
          throw new Error(message);
        }
        return payload;
      }

      function showTokenGate(message) {
        $('tokenGate').dataset.show = 'true';
        $('tokenErr').textContent = message || '';
        const input = $('tokenInput');
        if (!input.value) {
          input.value = token();
        }
        input.focus();
      }

      function hideTokenGate() {
        $('tokenGate').dataset.show = 'false';
      }

      $('tokenSaveBtn').addEventListener('click', async () => {
        const value = $('tokenInput').value.trim();
        if (!value) {
          $('tokenErr').textContent = '请先粘贴令牌。';
          return;
        }
        try {
          const probe = await fetch('/sessions', { headers: { 'x-bridge-token': value } });
          if (!probe.ok) {
            throw new Error('令牌无效（HTTP ' + probe.status + '）');
          }
          try {
            sessionStorage.setItem('bridge.token', value);
          } catch {
            /* 隐私模式下写不了；内存里的这份本次会话仍然有效 */
          }
          hideTokenGate();
          loadHistory();
        } catch (error) {
          $('tokenErr').textContent = String(error.message).slice(0, 140);
        }
      });

      $('tokenSkipBtn').addEventListener('click', hideTokenGate);
      $('tokenInput').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          $('tokenSaveBtn').click();
        }
      });

      function setStatus(tone, message) {
        const node = $('status');
        node.dataset.tone = tone;
        node.textContent = message;
      }

      /* ── 席位名由服务端算 ──────────────────────────────────────
         席位名同时是会话身份（进 conversationId），前端自己算一遍
         就可能和服务端漂移，静默复用错会话。只认 /meeting/plan。 */
      async function refreshSeatNames() {
        try {
          const plan = await api('/meeting/plan', {
            method: 'POST',
            body: JSON.stringify({
              template:
                state.mode === 'parallel' ? 'meeting-parallel-web' : 'meeting-round-robin-web',
              participants: state.seats.map((seat) => seat.provider),
              summarizer: state.summarizer,
              ...(state.summarizerSeat ? { summarizerSeat: state.summarizerSeat } : {}),
            }),
          });
          // alias 与 provider 一起留着：复用列表要按 provider 过滤，
          // 光有别名看不出背后是哪个模型。
          state.planParticipants = plan.participants;
          state.seatAliases = plan.participants.map((p) => p.alias);
        } catch {
          // 服务端拒绝（比如复用了不属于总结者的席位）时，别把上一次的席位名
          // 留着继续用——那正是"界面显示复用、实际开新会话"的来源。
          const counters = new Map();
          state.planParticipants = state.seats.map((seat) => {
            const n = (counters.get(seat.provider) ?? 0) + 1;
            counters.set(seat.provider, n);
            return { alias: `${seat.provider}${n}`, provider: seat.provider };
          });
          state.seatAliases = state.planParticipants.map((p) => p.alias);
        }
        if (state.summarizerSeat && !state.seatAliases.includes(state.summarizerSeat)) {
          state.summarizerSeat = '';
        }
        renderSettings();
      }

      /* ── 侧栏历史 ─────────────────────────────────────────── */
      function dayKey(ts) {
        const d = new Date(ts);
        const today = new Date();
        const sameDay = (a, b) =>
          a.getFullYear() === b.getFullYear() &&
          a.getMonth() === b.getMonth() &&
          a.getDate() === b.getDate();
        if (sameDay(d, today)) return '今天';
        const yesterday = new Date(today.getTime() - 86400000);
        if (sameDay(d, yesterday)) return '昨天';
        const week = new Date(today.getTime() - 7 * 86400000);
        if (d >= week) return '最近 7 天';
        return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月';
      }

      async function loadHistory() {
        const list = $('history');
        try {
          const { meetings } = await api('/meetings');
          if (!meetings.length) {
            list.innerHTML = '<div class="sidebar-empty">还没有会议记录。</div>';
            return;
          }
          const groups = new Map();
          for (const m of meetings) {
            const key = dayKey(m.updatedAt);
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(m);
          }
          list.innerHTML = '';
          for (const [key, items] of groups) {
            const head = document.createElement('div');
            head.className = 'history-group';
            head.textContent = key;
            list.append(head);
            for (const m of items) {
              const row = document.createElement('div');
              row.className = 'history-item';
              row.setAttribute('aria-current', String(m.id === state.meetingId));

              const title = document.createElement('span');
              title.className = 'history-title';
              title.textContent = m.title;

              const meta = document.createElement('span');
              meta.className = 'history-meta';
              meta.textContent = m.turns ? `${m.turns}轮` : '';

              const del = document.createElement('button');
              del.className = 'history-del';
              del.textContent = '×';
              del.title = '删除这场会议';
              del.addEventListener('click', async (event) => {
                event.stopPropagation();
                if (!confirm(`删除「${m.title}」？该会议的记录会被移除。`)) {
                  return;
                }
                await api('/meetings/' + m.id, { method: 'DELETE' });
                if (state.meetingId === m.id) {
                  resetToNew();
                }
                loadHistory();
              });

              row.append(title, meta, del);
              row.addEventListener('click', () => {
                openMeeting(m.id);
                // 浮层打开时它盖住了整屏，点完必须自己关掉，不然正文永远看不见
                if ($('sidebar').dataset.open === 'true') {
                  setSidebar(false);
                }
              });
              list.append(row);
            }
          }
        } catch (error) {
          list.innerHTML = `<div class="sidebar-empty">${escapeHtml(String(error.message))}</div>`;
        }
      }

      /* ── 渲染一场会议 ─────────────────────────────────────── */
      function bubbleFor(entry) {
        const row = document.createElement('div');
        row.className = 'msg' + (entry.role === 'user' ? ' user' : '');
        row.dataset.collapseKey = collapseKey(entry);
        const isSummary = entry.stage === 'summary';

        if (entry.role !== 'user') {
          const avatar = document.createElement('div');
          avatar.className = 'avatar' + (isSummary ? ' summary' : '');
          // 席位名去掉末尾序号后取首字母，同一家也能一眼分开
          avatar.textContent = (entry.speaker || '?').replace(/\d+$/, '').slice(0, 2).toUpperCase();
          row.append(avatar);
        }

        const main = document.createElement('div');
        main.className = 'msg-main';

        if (entry.role !== 'user') {
          const who = document.createElement('div');
          who.className = 'msg-who';
          const name = document.createElement('span');
          name.className = 'msg-name';
          name.textContent = isSummary ? `总结者 · ${entry.speaker}` : entry.speaker;
          who.append(name);
          if (entry.stage !== 'discussion') {
            const stage = document.createElement('span');
            stage.className = 'msg-stage';
            stage.textContent = STAGE_LABEL[entry.stage] || entry.stage;
            who.append(stage);
          }
          // 折叠：一轮下来可能五六个模型各写几百字，时间线会被拉得很长。
          // 收起时留一行开头预览，不至于连"谁说了什么"都看不见。
          const caret = document.createElement('button');
          caret.className = 'msg-caret';
          caret.textContent = '▾';
          caret.title = '折叠 / 展开';
          caret.addEventListener('click', () => toggleCollapse(row, caret));
          who.append(caret);
          main.append(who);
        }

        const body = document.createElement('div');
        body.className = 'msg-body';
        body.innerHTML =
          entry.role === 'user'
            ? escapeHtml(entry.content).replace(/\n/g, '<br>')
            : render(entry.content);
        if (isSummary) {
          body.classList.add('summary-card');
        }
        main.append(body);
        // 折叠时露出的那一行预览：光把正文 clip 掉会断在半句话上，
        // 单独铺一行干净的纯文本更像"他大概说了什么"。
        // 顺手抹掉 Markdown 记号，否则预览里会露出 ** 和 # 这种渲染后才消失的东西。
        const preview = document.createElement('div');
        preview.className = 'msg-preview';
        preview.textContent = (entry.content || '')
          .replace(/```[\s\S]*?```/g, ' ')
          .replace(/[*_`>#|-]/g, '')
          .replace(/\s+/g, ' ')
          .trim()
          .slice(0, 70);
        if (entry.role !== 'user') {
          main.append(preview);
        }
        row.append(main);
        // 折叠状态按人记，重新打开这场会议时保持原样
        if (entry.role !== 'user' && collapsedKeys.has(collapseKey(entry))) {
          row.classList.add('collapsed');
          const caret = caretFor(row);
          if (caret) {
            caret.textContent = '▸';
          }
        }
        return row;
      }

      function caretFor(row) {
        return row.querySelector('.msg-caret');
      }

      function collapseKey(entry) {
        return `${entry.speaker}|${entry.stage}|${entry.round ?? 0}`;
      }

      /** 折叠状态按「人 + 轮次」记，重新打开这场会议时保持原样。 */
      const collapsedKeys = new Set();

      function toggleCollapse(row, caret) {
        const key = row.dataset.collapseKey;
        const collapsed = row.classList.toggle('collapsed');
        caret.textContent = collapsed ? '▸' : '▾';
        if (!key) {
          return;
        }
        if (collapsed) {
          collapsedKeys.add(key);
        } else {
          collapsedKeys.delete(key);
        }
      }

      /* ── 边写边显示 ──────────────────────────────────────────
         Grok 走 WebSocket，帧是一帧一帧到的，所以能真正做到"有字就显示"，
         不用对着空白等整段写完。其他 provider 的 HTTP 流只能在生成结束后
         一次性取到 body，推不了增量——但它们至少会先收到 meeting.speaking，
         所以那个人会**立刻**冒出来写着"正在写…"，不至于让人分不清是在跑还是卡住。
      ─────────────────────────────────────────────────────── */
      const liveBubbles = new Map();

      function liveKey(speaker, round) {
        return `${speaker}#${round}`;
      }

      /**
       * 某个人开始写了 —— 气泡**立刻**出现，正文先显示「正在写…」。
       *
       * 没有这一步，从"他开始写"到"他写完"这整段时间里屏幕上什么都不变，
       * 用户分不清是在跑还是卡住了。走 HTTP 的 provider 推不出增量，
       * 这个占位就是他们唯一的进度反馈。
       */
      /**
       * 本轮容器。实时气泡和最终气泡必须挂在同一个父节点上，否则
       * "先冒出来的占位"和"后来替换上去的完整发言"会落在时间线的不同位置，
       * 看起来就像顺序乱了。
       */
      function turnContainer() {
        return state.turnWrap ?? $('transcript');
      }

      function showSpeaking(speaker, provider, round, stage) {
        const key = liveKey(speaker, round);
        if (liveBubbles.has(key)) {
          return;
        }
        $('welcome').hidden = true;
        const node = bubbleFor({ role: 'assistant', speaker, provider, stage, round, content: '' });
        node.classList.add('streaming', 'speaking');
        const body = node.querySelector('.msg-body');
        body.textContent = '正在写…';
        turnContainer().append(node);
        liveBubbles.set(key, node);
        scrollToEnd();
      }

      function appendLiveDelta(speaker, provider, round, text, stage) {
        if (!text) {
          return;
        }
        const key = liveKey(speaker, round);
        let node = liveBubbles.get(key);

        if (!node) {
          $('welcome').hidden = true;
          node = bubbleFor({ role: 'assistant', speaker, provider, stage, round, content: '' });
          node.classList.add('streaming');
          turnContainer().append(node);
          liveBubbles.set(key, node);
        }
        // 有真字了就撤掉占位
        node.classList.remove('speaking');
        const body = node.querySelector('.msg-body');
        const base = node.dataset.text || '';
        const next = base + text;
        node.dataset.text = next;
        body.innerHTML = render(next);
        scrollToEnd();
      }

      function closeLiveBubble(speaker, round) {
        const node = liveBubbles.get(liveKey(speaker, round));
        if (node) {
          node.classList.remove('streaming');
          liveBubbles.delete(liveKey(speaker, round));
        }
      }

      /** 重新渲染整条时间线时，把残留的流式气泡状态清掉。 */
      function resetLiveBubbles() {
        for (const node of liveBubbles.values()) {
          node.classList.remove('streaming');
        }
        liveBubbles.clear();
      }

      function renderTranscript(meeting) {
        $('welcome').hidden = true;
        const column = $('transcript');
        column.innerHTML = '';
        resetLiveBubbles();
        for (const turn of meeting.turns) {
          const wrap = document.createElement('div');
          wrap.className = 'turn';
          wrap.append(
            bubbleFor({ role: 'user', speaker: 'user', stage: 'input', content: turn.userMessage }),
          );
          for (const entry of turn.entries) {
            wrap.append(bubbleFor(entry));
          }
          column.append(wrap);
        }
        scrollToEnd();
      }

      function scrollToEnd() {
        const scroll = $('scroll');
        requestAnimationFrame(() => {
          scroll.scrollTop = scroll.scrollHeight;
        });
      }

      async function openMeeting(id) {
        // 用户切到别的会议：旧的发送流和轮询都自行退出，别再往新时间线里写。
        liveSendToken += 1;
        try {
          const { meeting } = await api('/meetings/' + id);
          state.meetingId = meeting.id;
          state.mode = meeting.mode;
          state.seats = meeting.participants.map((provider) => ({ provider }));
          state.summarizer = meeting.summarizer;
          state.summarizerSeat = meeting.summarizerSeat;
          state.rounds = meeting.rounds;

          $('meetingTitle').textContent = meeting.title;
          $('meetingMeta').textContent = meeting.turns.length
            ? `${meeting.turns.length} 轮 · ${meeting.participants.length} 席位`
            : '';
          syncUrl();
          await refreshSeatNames();
          renderTranscript(meeting);
          setStatus(
            'ok',
            meeting.turns.length ? '继续提问即可接上之前的发言。' : '写下第一个问题。',
          );
          loadHistory();
          // 上一轮可能还在服务端跑着（用户中途切走过），把进度接上。
          attachToRun(meeting.id);
        } catch (error) {
          setStatus('err', String(error.message));
        }
      }

      /** 地址栏带上会议 id，方便分享、刷新、收藏（和 ChatGPT 的 /c/<uuid> 一个意思）。 */
      function syncUrl() {
        const path = state.meetingId ? `/meeting/${state.meetingId}` : '/meeting';
        // 查询串必须一起带上。`?token=` 是链接的一部分，replaceState 顺手抹掉的话，
        // 复制出去的地址在别的设备上打开就没令牌了——正是分享链接要解决的问题。
        const url = path + location.search;
        if (location.pathname + location.search !== url) {
          history.replaceState(null, '', url);
        }
      }

      function meetingIdFromUrl() {
        const match = location.pathname.match(/^\/meeting\/(meeting-[0-9a-f-]+)$/);
        return match ? match[1] : null;
      }

      /**
       * 接上一场正在后台跑的会议。
       *
       * 会议跑在服务端，页面订阅只是"看"。所以中途切去控制台、去看别的会议、
       * 甚至关掉页面，会议照跑；回来时靠这个轮询把进度和最终结果取回来。
       */
      let runTimer = null;
      // 轮询代次：切会、重连、停看时加一，旧循环在下一个 await 后自行退出。
      // 之前只靠 state.meetingId 比对，而比对点在 3 秒 sleep 之后——切会发生在
      // fetch 途中时，旧会议的气泡照样写进新时间线；stopWatchingRun 清的 runTimer
      // 又恒为 null，等于没有取消。
      let watchToken = 0;
      // 发送流代次：切会 / 新建会议时加一，正在读旧流的 send 循环自行断流退出。
      // 服务端会议照跑（回来用轮询接上），只是不再往已经切走的页面里写气泡。
      let liveSendToken = 0;
      async function attachToRun(meetingId) {
        const mine = ++watchToken;
        stopWatchingRunTimerOnly();
        const column = $('transcript');
        for (;;) {
          let run;
          try {
            ({ run } = await api('/meeting/runs/' + meetingId));
          } catch {
            return; // 没在跑（或已经跑完落库了），不必再盯
          }
          // fetch 途中用户切走了：这份数据已经不属于当前页面，直接丢掉。
          if (mine !== watchToken || state.meetingId !== meetingId) {
            return;
          }
          if (!run || run.status !== 'running') {
            return;
          }

          // 按"人+阶段+轮"对账，而不是按条数 slice：
          // 服务端增量是攒进同一条的（半截先到、完整后来替换），条数根本不变，
          // 按条数取永远看不到完整版；按内容前 24 字认还会把半截和完整认成同一条。
          // 这里有就地更新、没有才追加。
          for (const entry of run.entries) {
            const key = `${entry.speaker}|${entry.stage}|${entry.round ?? 0}`;
            const existing = column.querySelector(`[data-collapse-key="${CSS.escape(key)}"]`);
            // 内容没变就不碰 DOM：每 3 秒全量替换会打断用户正在选中的文字。
            const fingerprint = `${(entry.content || '').length}:${(entry.content || '').slice(-32)}`;
            if (existing) {
              if (existing.dataset.fingerprint !== fingerprint) {
                const fresh = bubbleFor(entry);
                fresh.dataset.fingerprint = fingerprint;
                existing.replaceWith(fresh);
              }
            } else {
              const node = bubbleFor(entry);
              node.dataset.fingerprint = fingerprint;
              column.append(node);
            }
          }
          $('welcome').hidden = true;
          // 谁正在写也要还原出来，否则回来只看到几条已完成的，
          // 分不清"还没开始"和"有人正卡在生成上"。
          if (run.speaking) {
            const key = liveKey(run.speaking.speaker, run.speaking.round);
            const node = liveBubbles.get(key);
            if (node) {
              node.remove();
              liveBubbles.delete(key);
            }
            showSpeaking(
              run.speaking.speaker,
              run.speaking.provider,
              run.speaking.round,
              run.speaking.round === 0 ? 'summary' : 'discussion',
            );
          }
          scrollToEnd();
          setStatus(
            'busy',
            run.speaking
              ? `${run.speaking.speaker} 正在写…已收到 ${run.entries.length} 条，可以随意切走。`
              : `后台运行中…已收到 ${run.entries.length} 条发言，可以随意切走。`,
          );

          await new Promise((resolve) => setTimeout(resolve, 3000));
          // sleep 途中切走 / 停看：代次已经变了，直接退出，不再发下一轮请求。
          if (mine !== watchToken || state.meetingId !== meetingId) {
            return;
          }
        }
      }

      function stopWatchingRunTimerOnly() {
        if (runTimer) {
          clearTimeout(runTimer);
          runTimer = null;
        }
      }

      function stopWatchingRun() {
        // 加代次，正在进行的循环在下一个 await 后自行退出。
        watchToken += 1;
        // 顺带让正在读流的 send 也停下来（resetToNew 会调到这里）。
        liveSendToken += 1;
        stopWatchingRunTimerOnly();
      }

      /** 这场会议库里有没有真的记下轮次。没有就别重画，否则会把现场擦成空白。 */
      async function hasRecordedTurn(meetingId) {
        try {
          const { meeting } = await api('/meetings/' + meetingId);
          return Array.isArray(meeting?.turns) && meeting.turns.length > 0;
        } catch {
          return false;
        }
      }

      function resetToNew() {
        state.meetingId = null;
        stopWatchingRun();
        setSidebar(false);
        state.mode = 'round-robin';
        state.seats = ['chatgpt', 'claude', 'deepseek'].map((provider) => ({ provider }));
        state.summarizer = 'qwen';
        state.summarizerSeat = '';
        state.rounds = 1;
        syncUrl();
        $('meetingTitle').textContent = '新会议';
        $('meetingMeta').textContent = '';
        $('transcript').innerHTML = '';
        $('welcome').hidden = false;
        refreshSeatNames();
        setStatus('ok', '选好席位，写下第一个问题。');
        loadHistory();
      }

      /* ── 设置面板 ─────────────────────────────────────────── */
      async function renderSettings() {
        const modeRow = document.querySelectorAll('.mode-row .chip');
        modeRow.forEach((chip) => {
          chip.dataset.on = String(chip.dataset.mode === state.mode);
        });
        $('modeChip').lastChild.textContent = MODE_LABEL[state.mode];

        const list = $('seatList');
        list.innerHTML = '';
        state.seats.forEach((seat, index) => {
          const row = document.createElement('div');
          row.className = 'seat';

          const picker = document.createElement('select');
          for (const id of PROVIDERS) {
            const option = document.createElement('option');
            option.value = id;
            option.textContent = LABELS[id];
            picker.append(option);
          }
          picker.value = seat.provider;
          picker.addEventListener('change', async () => {
            seat.provider = picker.value;
            await refreshSeatNames();
          });

          const name = document.createElement('span');
          name.className = 'seat-name';
          name.textContent = state.seatAliases[index] || '—';

          const up = document.createElement('button');
          up.className = 'ghost';
          up.textContent = '↑';
          up.disabled = index === 0;
          up.addEventListener('click', async () => {
            [state.seats[index - 1], state.seats[index]] = [
              state.seats[index],
              state.seats[index - 1],
            ];
            await refreshSeatNames();
          });

          const down = document.createElement('button');
          down.className = 'ghost';
          down.textContent = '↓';
          down.disabled = index === state.seats.length - 1;
          down.addEventListener('click', async () => {
            [state.seats[index + 1], state.seats[index]] = [
              state.seats[index],
              state.seats[index + 1],
            ];
            await refreshSeatNames();
          });

          const remove = document.createElement('button');
          remove.className = 'ghost';
          remove.textContent = '×';
          remove.addEventListener('click', async () => {
            state.seats.splice(index, 1);
            await refreshSeatNames();
          });

          row.append(picker, name, up, down, remove);
          list.append(row);
        });

        const seatSelect = $('summarizerSeat');
        seatSelect.innerHTML = '';
        const fresh = document.createElement('option');
        fresh.value = '';
        fresh.textContent = '新会话';
        seatSelect.append(fresh);
        // **只列总结者自己的席位。** 复用靠的是同名 ⇒ 同 conversationId ⇒ 命中同一个
        // 浏览器标签页，跨模型压根不成立。原来这里把全部席位都列出来，于是选
        // 总结者=qwen 时还能勾「复用 chatgpt1」，结果开出来是个挂着 chatgpt 名字的
        // 全新 qwen 会话，底下那句提示还是在说假话。
        for (const seat of state.planParticipants) {
          if (seat.provider !== state.summarizer) {
            continue;
          }
          const option = document.createElement('option');
          option.value = seat.alias;
          option.textContent = `复用 ${seat.alias}`;
          seatSelect.append(option);
        }
        if (!seatSelect.querySelector(`option[value="${state.summarizerSeat}"]`)) {
          // 原来的选择已经不属于当前总结者了，别留着发出去让服务端报错
          state.summarizerSeat = '';
        }
        seatSelect.value = state.summarizerSeat;
        $('summarizer').value = state.summarizer;
        $('rounds').value = state.rounds;
        $('seatHint').textContent = state.summarizerSeat
          ? `总结会在 ${state.summarizerSeat} 的同一个网页会话里收口，因此它记得自己刚才说了什么。`
          : '总结者每次都用新会话。留空即如此。';
        $('addSeatBtn').disabled = state.seats.length >= MAX_SEATS;
        $('addSeatBtn').textContent =
          state.seats.length >= MAX_SEATS ? `最多 ${MAX_SEATS} 个席位` : '添加参与者';

        $('seatsChipText').textContent = `${state.seats.length} 个席位`;
        $('seatsChip').dataset.on = String(state.seats.length > 0);
      }

      /* ── 发送 ─────────────────────────────────────────────── */
      async function send() {
        if (state.busy) {
          return;
        }
        const question = $('input').value.trim();
        if (!question) {
          return;
        }
        if (state.seats.length < 2) {
          setStatus('err', '会议至少需要两个参与者。');
          $('settings').dataset.open = 'true';
          return;
        }

        state.busy = true;
        $('sendBtn').disabled = true;
        $('welcome').hidden = true;
        $('input').value = '';
        setStatus('busy', state.mode === 'round-robin' ? '席位依次发言中…' : '席位同时作答中…');

        // 用户气泡先出现，别等网络回来才看到自己说的话
        const column = $('transcript');
        const wrap = document.createElement('div');
        wrap.className = 'turn';
        wrap.append(
          bubbleFor({ role: 'user', speaker: 'user', stage: 'input', content: question }),
        );
        const pending = document.createElement('div');
        pending.className = 'msg pending';
        wrap.append(pending);
        column.append(wrap);
        state.turnWrap = wrap;
        scrollToEnd();

        const template =
          state.mode === 'parallel' ? 'meeting-parallel-web' : 'meeting-round-robin-web';
        const body = {
          model: template,
          meeting: {
            participants: state.seats.map((seat) => seat.provider),
            summarizer: state.summarizer,
            summarizerSeat: state.summarizerSeat || undefined,
            rounds: state.rounds,
          },
          stream: true,
          messages: [{ role: 'user', content: question }],
          ...(state.meetingId ? { conversationId: state.meetingId } : {}),
        };

        try {
          const response = await fetch('/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(token() ? { 'x-bridge-token': token() } : {}),
            },
            body: JSON.stringify(body),
          });
          if (!response.ok) {
            const raw = await response.text();
            let message = raw;
            try {
              message = JSON.parse(raw)?.error?.message || raw;
            } catch {
              /* 保留原文 */
            }
            throw new Error(message);
          }

          let summary = '';
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          // 切会后不再往页面写东西：finally 里那套"重画时间线"也一起跳过，
          // 否则会把新会议的现场擦掉重画成旧的。
          let aborted = false;
          const sendMine = liveSendToken;
          for (;;) {
            const chunk = await reader.read();
            if (sendMine !== liveSendToken) {
              aborted = true;
              try {
                await reader.cancel();
              } catch {
                /* 断流本身不需要再报 */
              }
              return;
            }
            buffer += chunk.done ? decoder.decode() : decoder.decode(chunk.value, { stream: true });
            let cut;
            while ((cut = buffer.indexOf('\n\n')) !== -1) {
              const rawEvent = buffer.slice(0, cut);
              buffer = buffer.slice(cut + 2);
              const line = rawEvent.split('\n').find((l) => l.startsWith('data:'));
              if (!line) continue;
              const data = line.slice(5).trim();
              if (!data || data === '[DONE]') continue;
              let event;
              try {
                event = JSON.parse(data);
              } catch {
                continue;
              }
              if (event.type === 'meeting.started') {
                state.meetingId = event.meeting.conversationId;
                syncUrl();
                $('meetingMeta').textContent = `${state.seats.length} 席位`;
              } else if (event.type === 'meeting.speaking') {
                // 人先冒出来，正文随后填进去
                pending.remove();
                showSpeaking(
                  event.speaker,
                  event.provider,
                  event.round,
                  event.round === 0 ? 'summary' : 'discussion',
                );
              } else if (event.type === 'meeting.delta') {
                // 有字就显示，不等这个人写完。
                pending.remove();
                appendLiveDelta(
                  event.speaker,
                  event.provider,
                  event.round,
                  event.contentDelta,
                  event.round === 0 ? 'summary' : 'discussion',
                );
              } else if (event.type === 'meeting.entry' && event.entry) {
                pending.remove();
                // 如果这条已经用 delta 逐字显示过了，就地替换成完整气泡，
                // 不要重复出现两次。
                const key = liveKey(event.entry.speaker, event.entry.round ?? 0);
                const existing = liveBubbles.get(key);
                if (existing) {
                  liveBubbles.delete(key);
                  existing.replaceWith(bubbleFor(event.entry));
                } else {
                  turnContainer().append(bubbleFor(event.entry));
                }
                scrollToEnd();
              } else if (event.type === 'meeting.error') {
                throw new Error(event.error?.message || '会议出错');
              } else if (event.conversationId) {
                state.meetingId = event.conversationId;
                syncUrl();
              } else {
                summary += event?.choices?.[0]?.delta?.content || '';
              }
            }
            if (chunk.done) break;
          }

          pending.remove();
          // 总结已经通过 meeting.entry 正常进时间线了（和别的发言一样带折叠键）。
          // 以前这里还会拿末尾的 OpenAI 形状 chunk 单独补一张"统一答复"卡片，
          // 同一段话显示两遍，所以去掉了。
          // 万一事件没来（比如中途断流），至少别让总结整段丢掉。
          if (summary && !liveBubbles.size && !turnContainer().querySelector('.summary-card')) {
            const card = document.createElement('div');
            card.className = 'msg';
            card.innerHTML =
              '<div class="avatar summary">Σ</div><div class="msg-main">' +
              '<div class="msg-who"><span class="msg-name">统一答复</span>' +
              '<span class="msg-stage">总结</span></div>' +
              `<div class="msg-body summary-card">${render(summary)}</div></div>`;
            turnContainer().append(card);
            scrollToEnd();
          }
          setStatus('ok', '完成。');
        } catch (error) {
          pending.remove();
          setStatus('err', String(error.message));
        } finally {
          state.busy = false;
          state.turnWrap = null;
          $('sendBtn').disabled = $('input').value.trim() === '';
          if (aborted) {
            // 切会后直接收工：下面的重画属于旧会议，会擦掉新会议的现场。
            return;
          }
          //
          // 中途出错时这一轮是空的，原来这里无条件 openMeeting，而 openMeeting
          // 会 `column.innerHTML = ''` 再按记录重画 —— 于是屏幕上刚才还能看到的
          // 占位和发言**全被擦掉**，表现就是"弹了个错然后一片空白"。
          // 宁可留着现场，也不要抹掉。
          if (state.meetingId) {
            const recorded = await hasRecordedTurn(state.meetingId);
            if (recorded) {
              openMeeting(state.meetingId);
            } else {
              loadHistory();
            }
          }
        }
      }

      /* ── 绑定 ─────────────────────────────────────────────── */
      $('sendBtn').addEventListener('click', send);
      $('input').addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
          event.preventDefault();
          send();
        }
      });
      $('input').addEventListener('input', () => {
        $('sendBtn').disabled = state.busy || $('input').value.trim() === '';
      });
      $('newMeetingBtn').addEventListener('click', resetToNew);
      $('refreshListBtn').addEventListener('click', loadHistory);
      function setSidebar(open) {
        const sidebar = $('sidebar');
        sidebar.dataset.open = String(open);
        document.body.dataset.sidebar = open ? 'open' : 'closed';
      }

      $('toggleSidebarBtn').addEventListener('click', () => {
        setSidebar($('sidebar').dataset.open !== 'true');
      });
      $('closeSidebarBtn').addEventListener('click', () => setSidebar(false));
      // Esc 关浮层，和桌面上的习惯一致
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && $('sidebar').dataset.open === 'true') {
          setSidebar(false);
        }
      });
      $('settingsChip').addEventListener('click', () => {
        const panel = $('settings');
        panel.dataset.open = panel.dataset.open === 'true' ? 'false' : 'true';
        $('settingsChip').dataset.on = String(panel.dataset.open === 'true');
      });
      $('modeChip').addEventListener('click', () => {
        $('settings').dataset.open = 'true';
        $('settingsChip').dataset.on = 'true';
      });
      $('seatsChip').addEventListener('click', () => {
        $('settings').dataset.open = 'true';
        $('settingsChip').dataset.on = 'true';
      });
      for (const chip of document.querySelectorAll('.mode-row .chip')) {
        chip.addEventListener('click', async () => {
          state.mode = chip.dataset.mode;
          await refreshSeatNames();
        });
      }
      $('addSeatBtn').addEventListener('click', async () => {
        if (state.seats.length >= MAX_SEATS) {
          setStatus('err', `席位最多 ${MAX_SEATS} 个。`);
          return;
        }
        const used = new Set(state.seats.map((s) => s.provider));
        state.seats.push({ provider: PROVIDERS.find((id) => !used.has(id)) ?? PROVIDERS[0] });
        await refreshSeatNames();
      });
      $('summarizer').addEventListener('change', async () => {
        state.summarizer = $('summarizer').value;
        await refreshSeatNames();
      });
      $('summarizerSeat').addEventListener('change', async () => {
        state.summarizerSeat = $('summarizerSeat').value;
        await refreshSeatNames();
      });
      $('rounds').addEventListener('change', () => {
        state.rounds = Number($('rounds').value) || 1;
      });
      $('meetingTitle').addEventListener('click', () => {
        if (!state.meetingId) return;
        const input = document.createElement('input');
        input.className = 'title-input';
        input.value = $('meetingTitle').textContent;
        $('meetingTitle').replaceWith(input);
        input.focus();
        input.select();
        const commit = async () => {
          const title = input.value.trim();
          if (title) {
            await api('/meetings/' + state.meetingId, {
              method: 'PATCH',
              body: JSON.stringify({ title }),
            });
            $('meetingTitle').textContent = title;
            loadHistory();
          }
          const h = document.createElement('h1');
          h.id = 'meetingTitle';
          h.textContent = title;
          h.addEventListener('click', () => $('meetingTitle').click());
          input.replaceWith(h);
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') input.blur();
        });
      });

      /* ── 启动 ─────────────────────────────────────────────── */
      (async function boot() {
        const summarizer = $('summarizer');
        for (const id of PROVIDERS) {
          const option = document.createElement('option');
          option.value = id;
          option.textContent = LABELS[id];
          summarizer.append(option);
        }
        summarizer.value = state.summarizer;
        await refreshSeatNames();
        if (token()) {
          loadHistory();
          // 地址栏带 id（/meeting/<id>）就直接打开那一场；分享、刷新、收藏都能用
          const fromUrl = meetingIdFromUrl();
          if (fromUrl) {
            openMeeting(fromUrl);
          }
        } else {
          showTokenGate('尚未提供访问令牌，所有接口都会返回 401。');
        }
      })();

      // 会议跑在服务端，这里离开页面不会打断它。回来时靠 /meeting/runs/:id
      // 把进度接上，所以切去控制台、去看别的会议记录都不影响。
      window.addEventListener('beforeunload', (event) => {
        if (!state.busy) {
          return;
        }
        event.preventDefault();
        event.returnValue = '';
      });
    </script>
  </body>
</html>
